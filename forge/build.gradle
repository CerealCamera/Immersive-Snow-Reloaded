plugins {
    id 'com.gradleup.shadow'
}

loom {
    forge {
        mixinConfig "immersive_snow_reloaded.mixins.json"
    }
}

architectury {
    platformSetupLoomIde()
    forge()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentForge.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    forge "net.minecraftforge:forge:$rootProject.forge_version"

    common(project(path: ':common', configuration: 'namedElements')) { transitive = false }
    shadowBundle project(path: ':common', configuration: 'transformProductionForge')

    modImplementation "maven.modrinth:serene-seasons:${rootProject.sereneseasons_forge}"
    modImplementation "maven.modrinth:glitchcore:${rootProject.glitchcore_forge}"
    modImplementation "maven.modrinth:snow-real-magic:${rootProject.snowrealmagic_forge}"
    modImplementation "maven.modrinth:kiwi:${rootProject.kiwi_forge}"
}

processResources {
    def props = [
            "id"              : rootProject.id,
            "name"            : rootProject.displayname,
            "description"     : rootProject.description,
            "author"          : rootProject.author,
            "license"         : rootProject.license,
            "websiteUrl"      : rootProject.website,
            "issueTrackerUrl" : rootProject.issues,
            "forgeUpdateUrl"  : rootProject.updater,
            "version"         : project.version,
            "minecraftVersion": rootProject.minecraft_version,
            "forgeVersion"    : rootProject.forge_version_dependency
    ]

    inputs.properties props
    filesMatching("META-INF/mods.toml") {
        expand props
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    inputFile.set shadowJar.archiveFile
}
