plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version + "+" + project.advertised_minecraft_version + "-fabric"
group = project.maven_group

repositories {
    maven { url "https://maven.parchmentmc.org" }
    maven { url "https://api.modrinth.com/maven" }
    maven { url "https://maven.terraformersmc.com/releases/" }
    maven { url "https://maven.neoforged.net/releases"}
    // Add repositories to retrieve artifacts from in here.
    // You should only use this when depending on other mods because
    // Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
    // See https://docs.gradle.org/current/userguide/declaring_repositories.html
    // for more information about repositories.
}

dependencies {
    // To change the versions see the gradle.properties file
    minecraft "com.mojang:minecraft:${project.minecraft_version}"

    implementation "net.fabricmc:fabric-loader:${project.loader_version}"

    // Fabric API. This is technically optional, but you probably want it anyway.
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    // These are only compile-time dependencies, their classes may or may not be absent/present at runtime.
    implementation "maven.modrinth:serene-seasons:${project.sereneseasons_version}"
    implementation "maven.modrinth:glitchcore:${project.glitchcore_version}"

    implementation "maven.modrinth:snow-real-magic:${project.snowrealmagic_version}"
    implementation "maven.modrinth:kiwi:${project.kiwi_version}"

    compileOnly "com.electronwill.night-config:core:3.6.0"
}

processResources {
    def props = [
            "id"                 : project.id,
            "name"               : project.displayname,
            "description"        : project.description,
            "author"             : project.author,
            "license"            : project.license,
            "websiteUrl"         : project.website,
            "issueTrackerUrl"    : project.issues,
            "forgeUpdateUrl"     : project.updater,
            "version"            : project.version,
            "minecraftDependency": project.fabric_minecraft_dependency
    ]

    inputs.properties props
    filesMatching("fabric.mod.json") { expand props }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}

java {
    // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
    // if it is present.
    // If you remove this line, sources will not be generated.
    withSourcesJar()

    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

jar {
    def projectName = project.name
    inputs.property "projectName", projectName

    from("LICENSE") {
        rename { "${it}_$projectName"}
    }
}