plugins {
    id 'com.gradleup.shadow'
}

architectury {
    platformSetupLoomIde()
    fabric()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    modImplementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"

    // Fabric API. This is technically optional, but you probably want it anyway.
    modImplementation "net.fabricmc.fabric-api:fabric-api:$rootProject.fabric_api_version"

    common(project(path: ':common', configuration: 'namedElements')) { transitive = false }
    shadowBundle project(path: ':common', configuration: 'transformProductionFabric')

    modImplementation "maven.modrinth:fabric-seasons:${rootProject.fabric_seasons}"
    modImplementation "com.terraformersmc:modmenu:${rootProject.mod_menu_version}"
    modImplementation "maven.modrinth:snow-real-magic:${rootProject.snowrealmagic_fabric}"
    modImplementation "maven.modrinth:kiwi:${rootProject.kiwi_fabric}"
    modImplementation "maven.modrinth:vanillabackport:${rootProject.vanillabackport_fabric}"
    modImplementation "maven.modrinth:platform:${rootProject.platform_fabric}"
}

processResources {
    def props = [
            "id"              : rootProject.id,
            "name"            : rootProject.displayname,
            "description"     : rootProject.description,
            "author"          : rootProject.author,
            "license"         : rootProject.license,
            "websiteUrl"      : rootProject.website,
            "issueTrackerUrl" : rootProject.issues,
            "version"         : project.version,
            "minecraftVersion": rootProject.minecraft_version,
            "fabricVersion"   : rootProject.fabric_loader_version_dependency,
            "neoForgeVersion" : rootProject.neoforge_version_dependency,
    ]

    inputs.properties props
    filesMatching("fabric.mod.json") {
        expand props
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    inputFile.set shadowJar.archiveFile
}