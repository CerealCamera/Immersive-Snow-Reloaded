plugins {
    id 'com.gradleup.shadow'
}

architectury {
    neoForge()
}

configurations {
    common
    shadowCommon
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common

    shadowBundle
}

repositories {
    maven { url "https://maven.neoforged.net/releases" }
    exclusiveContent {
        forRepository {maven {url "https://cursemaven.com/"}}
        filter {includeGroup "curse.maven"}
    }
    exclusiveContent {
        forRepository { maven { url "https://api.modrinth.com/maven" } }
        filter { includeGroup "maven.modrinth" }
    }
}

dependencies {
    neoForge "net.neoforged:neoforge:${rootProject.neoforge_version}"

    common(project(path: ":common", configuration: "namedElements")) { transitive false }
    shadowCommon(project(path: ":common", configuration: "transformProductionNeoForge")) { transitive false }

    modImplementation "maven.modrinth:serene-seasons:${rootProject.sereneseasons_neoforge}"
    modImplementation "maven.modrinth:glitchcore:${rootProject.glitchcore_neoforge}"
    modImplementation "maven.modrinth:snow-real-magic:${rootProject.snowrealmagic_neoforge}"
    modImplementation "maven.modrinth:kiwi:${rootProject.kiwi_neoforge}"
}

processResources {
    def props = [
            "id"              : rootProject.id,
            "name"            : rootProject.displayname,
            "description"     : rootProject.description,
            "author"          : rootProject.author,
            "license"         : rootProject.license,
            "websiteUrl"      : rootProject.website,
            "issueTrackerUrl" : rootProject.issues,
            "forgeUpdateUrl"  : rootProject.updater,
            "version"         : project.version,
            "minecraftVersion": rootProject.minecraft_version,
            "fabricVersion"   : rootProject.fabric_loader_version_dependency,
            "neoForgeVersion" : rootProject.neoforge_version_dependency,
    ]

    inputs.properties props
    filesMatching("META-INF/neoforge.mods.toml") {
        expand props
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    inputFile.set shadowJar.archiveFile
}