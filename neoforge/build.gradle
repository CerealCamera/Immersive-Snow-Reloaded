plugins {
    id 'com.gradleup.shadow'
}

architectury {
    platformSetupLoomIde()
    neoForge()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

repositories {
    maven {
        name = 'NeoForged'
        url = 'https://maven.neoforged.net/releases'
    }
}

dependencies {
    neoForge "net.neoforged:neoforge:$rootProject.neoforge_version"

    common(project(path: ':common')) { transitive = false }
    shadowBundle project(path: ':common', configuration: 'transformProductionNeoForge')

    implementation "maven.modrinth:serene-seasons:${project.sereneseasons_neoforge}"
    implementation "maven.modrinth:glitchcore:${project.glitchcore_neoforge}"

    compileOnly "maven.modrinth:snow-real-magic:${project.snowrealmagic_neoforge}"
    compileOnly "maven.modrinth:kiwi:${project.kiwi_neoforge}"
}

processResources {
    def props = [
            "id"                : rootProject.id,
            "name"              : rootProject.displayname,
            "description"       : rootProject.description,
            "author"            : rootProject.author,
            "license"           : rootProject.license,
            "websiteUrl"        : rootProject.website,
            "issueTrackerUrl"   : rootProject.issues,
            "neoForgeUpdateUrl" : rootProject.updater,
            "version"           : project.version
    ]

    inputs.properties props
    filesMatching("META-INF/neoforge.mods.toml") {
        expand props
    }
}

// Minecraft is not obfuscated on this version, so there is no remapJar task.
// The shaded jar is the mod jar that ships.
jar {
    archiveClassifier = 'dev'
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = null
}

assemble.dependsOn shadowJar

configurations {
    apiElements {
        outgoing.artifacts.clear()
        outgoing.artifact(shadowJar)
    }
    runtimeElements {
        outgoing.artifacts.clear()
        outgoing.artifact(shadowJar)
    }
}
