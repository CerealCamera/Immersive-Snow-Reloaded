plugins {
    id 'com.gradleup.shadow'
}

architectury {
    platformSetupLoomIde()
    neoForge()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

repositories {
    maven {
        name = 'NeoForged'
        url = 'https://maven.neoforged.net/releases'
    }
}

dependencies {
    neoForge "net.neoforged:neoforge:${rootProject.neoforge_version}"

    common(project(path: ':common', configuration: 'namedElements')) { transitive = false }
    shadowBundle project(path: ':common', configuration: 'transformProductionNeoForge')

    modImplementation "maven.modrinth:serene-seasons:${rootProject.sereneseasons_neoforge}"
    modImplementation "maven.modrinth:glitchcore:${rootProject.glitchcore_neoforge}"
}

processResources {
    def props = [
            "id"                 : project.id,
            "name"               : project.displayname,
            "description"        : project.description,
            "author"             : project.author,
            "license"            : project.license,
            "websiteUrl"         : project.website,
            "issueTrackerUrl"    : project.issues,
            "forgeUpdateUrl"     : project.updater,
            "version"            : project.version,
            "minecraftDependency": project.neoforge_minecraft_dependency,
            "neoForgeVersion"    : project.neoforge_dependency
    ]

    inputs.properties props
    filesMatching("META-INF/neoforge.mods.toml") {
        expand props
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    inputFile.set shadowJar.archiveFile
}
