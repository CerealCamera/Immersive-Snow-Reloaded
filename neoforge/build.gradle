plugins {
    id 'com.gradleup.shadow'
}

architectury {
    platformSetupLoomIde()
    neoForge()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

repositories {
    maven {
        name = 'NeoForged'
        url = 'https://maven.neoforged.net/releases'
    }
}

dependencies {
    neoForge "net.neoforged:neoforge:${rootProject.neoforge_version}"

    common(project(path: ':common', configuration: 'namedElements')) { transitive = false }
    shadowBundle project(path: ':common', configuration: 'transformProductionNeoForge')

    modImplementation "maven.modrinth:serene-seasons:${rootProject.sereneseasons_neoforge}"
    modImplementation "maven.modrinth:glitchcore:${rootProject.glitchcore_neoforge}"
    modImplementation "maven.modrinth:snow-real-magic:${rootProject.snowrealmagic_neoforge}"
    modImplementation "maven.modrinth:kiwi:${rootProject.kiwi_neoforge}"
    modImplementation "maven.modrinth:vanillabackport:${rootProject.vanillabackport_neoforge}"
    modImplementation "maven.modrinth:platform:${rootProject.platform_neoforge}"
}

processResources {
    def props = [
            "id"              : rootProject.id,
            "name"            : rootProject.displayname,
            "description"     : rootProject.description,
            "author"          : rootProject.author,
            "license"         : rootProject.license,
            "websiteUrl"      : rootProject.website,
            "issueTrackerUrl" : rootProject.issues,
            "forgeUpdateUrl"  : rootProject.updater,
            "version"         : project.version,
            "minecraftVersion": rootProject.minecraft_version,
            "fabricVersion"   : rootProject.fabric_loader_version_dependency,
            "neoForgeVersion" : rootProject.neoforge_version_dependency,
    ]

    inputs.properties props
    filesMatching("META-INF/neoforge.mods.toml") {
        expand props
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    inputFile.set shadowJar.archiveFile
}